name: hovsg
channels:
  - pytorch
  - nvidia
  - conda-forge
  - aihabitat
  - defaults
dependencies:
  - python=3.9
  - pip
  - numpy
  - habitat-sim
  - pytorch::faiss-gpu
  - scikit-learn
  - pandas
  - networkx
  - pillow=10.4.0
  - imageio-ffmpeg
  - graphviz
  - pygraphviz
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu128
    - torch==2.8.0+cu128
    - torchvision==0.23.0+cu128
    - torchaudio==2.8.0+cu128
    - matplotlib==3.7.3
    - scipy==1.13.1
    - open3d==0.18.0
    - opencv-python
    - git+https://github.com/facebookresearch/segment-anything.git
    - torchmetrics
    - ftfy
    - tqdm
    - open-clip-torch
    - transformers
    - openai==1.3.7
    - plyfile
    - hydra-core
    - pyvista
    - scikit-fmm
    - pathos
    - rosbags
    - opencv-python-headless==4.8.1.78
