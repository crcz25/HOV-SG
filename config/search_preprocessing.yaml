main:
  device: cuda
  cuda_device: 0
  dataset: hm3dsem
  split: val
  scene_id: 00824-Dd4bFSTQ8gi
  # HM3DSem walk root. The ground truth this run reads is
  # <dataset_path>/<split>/<scene_id>/scene_info.json plus its objects/*.ply,
  # which is what hovsg.eval.hm3dsem_evaluator.HM3DSemanticEvaluator loads.
  dataset_path: data/hm3dsem_walks
  # The predicted HOV-SG scene graph directory (floors/, rooms/, objects/).
  graph_path: data/scene_graphs/hm3dsem/00824-Dd4bFSTQ8gi/graph
  # How many objects a query returns.  5 is what HOV-SG's own application
  # asks for -- application/visualize_query_graph_back.py calls
  # query_hierarchy(query, top_k=5) -- so it is what the stock search answers
  # with.  Graph.query_object's signature default is 1; set 1203 (the object
  # count) to see the whole ranked list instead.
  top_k: 5
  # Where the three raw CSVs are written. Relative paths resolve against the
  # HOV-SG repository root, not against Hydra's run directory.
  output_dir: data/search_preprocessing/00824-Dd4bFSTQ8gi
eval:
  # The complete HM3DSem vocabulary: the same label bank, in the same order,
  # that Graph.segment_objects labeled the predicted objects with, so a
  # vocabulary class id here is the object nodes' label_idx.
  obj_labels: HM3DSEM_LABELS
  # Which ground-truth collection of scene_info.json to evaluate against.
  # "all_objects" is every annotated object of the HM3D-Sem scene, including
  # the ones the trajectory never observed; "objects" is only the
  # trajectory-visible subset that HM3DSemanticEvaluator reads.
  gt_object_collection: all_objects
validation:
  # Every class always goes through stock Graph.query_object -- its return
  # value is what the score table is written from.  This selects how many of
  # those returns are additionally checked against an independent
  # reproduction of the procedure behind them, scores included.
  # "all", "none", or an integer number of evenly spaced classes to check.
  stock_comparison_classes: all
models:
  clip:
    type: ViT-H-14 # ViT-L/14@336px # ViT-H-14
    checkpoint: checkpoints/laion2b_s32b_b79k.bin
