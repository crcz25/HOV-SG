main:
  device: cuda
  dataset: hm3dsem # scannet, replica
  scene_id: 00824-Dd4bFSTQ8gi # scene0011_00
  split: val
  package_path: /workspace/HOV-SG/hovsg/
  dataset_path: /workspace/HOV-SG/data/hm3dsem_walks/
  raw_data_path: /workspace/HOV-SG/data/hm3d
  save_path: /workspace/HOV-SG/data/hovsg/
dataset:
  hm3dsem:
    gt_skip_frames: 2
models:
  clip:
    type:  ViT-H-14 # ViT-L/14@336px # ViT-H-14
    checkpoint: checkpoints/laion2b_s32b_b79k.bin 
    # checkpoint: checkpoints/ovseg_clipl14_9a1909.pth checkpoints/laion2b_s32b_b79k.bin
  sam:
    checkpoint: checkpoints/sam_vit_h_4b8939.pth
    type: vit_h
    points_per_side: 12
    pred_iou_thresh: 0.88
    points_per_batch: 144
    crop_n_layers: 0
    stability_score_thresh: 0.95
    min_mask_region_area: 100
pipeline:
  create_graph: True
  voxel_size: 0.02
  skip_frames: 10
  init_overlap_thresh: 0.75
  overlap_thresh_factor: 0.025
  iou_thresh: 0.05
  clip_masked_weight: 0.4418
  clip_bbox_margin: 50 # in pixels
  feature_dbscan_eps: 0.01
  max_mask_distance: 10000 # 6.4239 in meters
  min_pcd_points: 100
  depth_weighting: false
  grid_resolution: 0.05
  merge_type: sequential # hierarchical, sequential
  save_intermediate_results: false
  obj_labels: HM3DSEM_LABELS
  # --- Object-level uncertainty signals -------------------------------------
  # Every signal is reported as a confidence P and its complement U = 1 - P.
  #
  # Semantic Uncertainty: P_sem = sigma(alpha * m_i) with
  #   m_i = cos(v_i, t_l) - max_{c: cos(t_c, t_l) < tau} cos(v_i, t_c)
  # alpha is CLIP's learned logit scale (100 at convergence), NOT a fitted
  # parameter: do not tune it to make the numbers look calibrated.
  semantic_uncertainty_logit_scale: 100.0
  # tau. Calibrated against cached HM3D text embeddings; excludes the named
  # synonym pairs. Raising it admits near-synonyms as competitors and shrinks
  # every margin.
  semantic_uncertainty_synonym_threshold: 0.75
  # Label Coherence uses the same alpha and the same tau, against in-map visual
  # prototypes: P_coh = sigma(alpha * m'_i) with
  #   m'_i = cos(v_i, mu_l) - max_{c: cos(t_c, t_l) < tau} cos(v_i, mu_c).
  # It estimates the same labeling error as P_sem, so the two are combined as
  # P_sem_bar = min(P_sem, P_coh), never multiplied.
  #
  # Cross-view Consistency: the mean pairwise cosine c_bar between the per-view
  # unit embeddings is recovered from ||m_i||^2 = 1/n + (1 - 1/n) c_bar, then
  # P_view = (1 + c_bar) / 2. No parameters.
  #
  # Vocabulary Membership: P_mem = L_C / (L_C + L_N) over the class set C and
  # the mined negative bank N, with L_C and L_N the |C|- and |N|-normalized
  # sums of exp(alpha * cos). Set max_class_similarity to null to disable the
  # signal and skip the one-time WordNet download.
  vocab_membership_max_class_similarity: 0.5
  # Optional cap on |N|, keeping the labels furthest from every vocabulary
  # class. P_mem itself does not depend on |N| (the normalization above removes
  # that dependence); this only bounds the encoding and storage cost of the
  # mined bank. null keeps the whole bank.
  vocab_membership_negative_label_count: null
  merge_objects_graph: false
  room_belief_merge_threshold: 0.5
