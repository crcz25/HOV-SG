services:
  hovsg-dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    image: hovsg-devcontainer:cuda12.9
    init: true
    command: sleep infinity
    working_dir: /workspace/HOV-SG
    shm_size: "16gb"
    ipc: host
    tty: true
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
      QT_X11_NO_MITSHM: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ..:/workspace/HOV-SG:cached
      - ../data:/workspace/HOV-SG/data:rw
      - ../checkpoints:/workspace/HOV-SG/checkpoints:rw

volumes: {}
